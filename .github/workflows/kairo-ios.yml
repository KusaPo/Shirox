name: Kairo iOS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kairo-ios/**'
      - '.github/workflows/kairo-ios.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Select an available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if "iOS" in runtime for x in items if x.get("isAvailable") and "iPhone" in x["name"]))')
          echo "KAIRO_TEST_DEVICE=$device_id" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test -project kairo-ios/Kairo.xcodeproj -scheme Kairo -destination "platform=iOS Simulator,id=$KAIRO_TEST_DEVICE" -derivedDataPath /tmp/kairo-derived -resultBundlePath /tmp/KairoTests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/kairo-build.log
      - name: Probe public source contracts
        if: always()
        continue-on-error: true
        run: python3 kairo-ios/scripts/probe_sources.py --live
      - name: Upload build log and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairo-build-results
          path: |
            /tmp/kairo-build.log
            /tmp/KairoTests.xcresult
          retention-days: 7
